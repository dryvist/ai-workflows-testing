name: Tests

on:
  pull_request:
    paths:
      - "agents/**"
      - "scripts/**"
      - "tests/**"
      - "dist/**"
      - "package.json"
  push:
    branches: [main, develop]
    paths:
      - "agents/**"
      - "scripts/**"
      - "tests/**"
      - "dist/**"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun test

  render-drift:
    name: Render drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read pinned ai-llm-prompts ref
        id: pinned
        run: echo "ref=$(cat PROMPTS_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout prompt catalog at the pinned ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: ${{ steps.pinned.outputs.ref }}
          sparse-checkout: automation/testing
          path: .ai-llm-prompts
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun scripts/render.mjs --prompts-dir .ai-llm-prompts

      - name: Fail on drift
        run: git diff --exit-code dist/
