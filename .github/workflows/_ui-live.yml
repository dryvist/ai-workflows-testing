# Reusable: live UI specs against a real target, through the synthetic
# Authelia identity (real TOTP 2FA, code minted by OpenBao — never a stored
# seed). Self-hosted only, on the dedicated `ui-synthetic` runner group. The
# CALLER decides its own triggers; this file only refuses pull_request (see
# the guard step) — a self-hosted runner must never execute untrusted
# fork-PR code. Document callers as schedule / workflow_dispatch / release.
#
# No hostname or catalog data lives here: the caller passes the target URL,
# and OpenBao paths are read by name only.
#
# Caller shape:
#   jobs:
#     ui-live:
#       uses: dryvist/ai-workflows-testing/.github/workflows/_ui-live.yml@main
#       with:
#         target_url: ${{ vars.WALL_URL }}
#         openbao_role: ui-synthetic
#         openbao_password_path: secret/data/synthetic/svc-synthetic-ui
#         openbao_totp_path: totp/code/svc-synthetic-ui
#       secrets:
#         OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
name: _ui-live

on:
  workflow_call:
    inputs:
      target_url:
        description: Base URL of the live target to test. Never a literal IP.
        type: string
        required: true
      runner_group:
        description: Self-hosted runner group label, restricted to this workflow ref.
        type: string
        required: false
        default: ui-synthetic
      working_directory:
        description: Directory containing the caller's package.json and Playwright config.
        type: string
        required: false
        default: "."
      openbao_role:
        description: OpenBao JWT role name (bound to this workflow's ref and the runner's source addresses).
        type: string
        required: false
        default: ui-synthetic
      openbao_jwt_mount:
        description: OpenBao auth mount path for the GitHub OIDC JWT method.
        type: string
        required: false
        default: github-actions
      openbao_jwt_audience:
        description: Audience bound on the OpenBao JWT role.
        type: string
        required: true
      openbao_user_var:
        description: OpenBao KV field holding the synthetic username.
        type: string
        required: false
        default: username
      openbao_password_path:
        description: OpenBao KV path (secret/data/... for a v2 mount) holding the synthetic password.
        type: string
        required: true
      openbao_password_field:
        description: Field name within openbao_password_path holding the password.
        type: string
        required: false
        default: password
      openbao_totp_path:
        description: OpenBao TOTP engine code path (e.g. totp/code/<name>).
        type: string
        required: true
    secrets:
      OPENBAO_ADDR:
        required: true

permissions:
  contents: read

concurrency:
  group: ui-live-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # A self-hosted runner must never run an untrusted fork's code. schedule,
  # workflow_dispatch and release are all repository-owner-controlled
  # triggers; pull_request is the one this file refuses outright.
  guard-trigger:
    name: Refuse pull_request on self-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject pull_request
        if: github.event_name == 'pull_request'
        run: |
          echo "::error::_ui-live.yml must never be triggered by pull_request (self-hosted runner)." >&2
          exit 1

  live:
    name: Playwright specs (live, synthetic login)
    needs: guard-trigger
    runs-on: [self-hosted, "${{ inputs.runner_group }}"]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Sparse-checkout the global-setup script from this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-workflows-testing
          ref: ${{ job.workflow_sha || 'main' }}
          path: .ai-workflows-testing
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - run: npm ci
      - run: npx playwright install chromium --with-deps

      # Mint a short-lived OpenBao token via GitHub OIDC, bound to this
      # workflow's ref and the runner's source address (per the role's
      # policy — see the synthetic identity docs). exportEnv is false: the
      # next step reads exactly the two fields it needs, nothing ambient.
      - name: Mint OpenBao token
        id: openbao
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.OPENBAO_ADDR }}
          method: jwt
          path: ${{ inputs.openbao_jwt_mount }}
          role: ${{ inputs.openbao_role }}
          jwtGithubAudience: ${{ inputs.openbao_jwt_audience }}
          exportEnv: false
          secrets: |
            ${{ inputs.openbao_password_path }} ${{ inputs.openbao_password_field }} | UI_LIVE_PASSWORD ;
            ${{ inputs.openbao_password_path }} ${{ inputs.openbao_user_var }} | UI_LIVE_USER ;
            ${{ inputs.openbao_totp_path }} code | UI_LIVE_TOTP_CODE

      - name: Run live specs through the synthetic login
        env:
          UI_LIVE_URL: ${{ inputs.target_url }}
          UI_LIVE_USER: ${{ steps.openbao.outputs.UI_LIVE_USER }}
          UI_LIVE_PASSWORD: ${{ steps.openbao.outputs.UI_LIVE_PASSWORD }}
          UI_LIVE_TOTP_CODE: ${{ steps.openbao.outputs.UI_LIVE_TOTP_CODE }}
        run: >-
          npx playwright test
          --config playwright.live.config.ts
          --global-setup ../.ai-workflows-testing/.github/scripts/playwright-global-setup.mjs

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-live-report
          path: |
            ${{ inputs.working_directory }}/playwright-report/
            ${{ inputs.working_directory }}/test-results/
          retention-days: 14
